<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Арканоид</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <span>Очки: <b id="score">0</b></span>
            <span>Жизни: <b id="lives">3</b></span>
            <span>Уровень: <b id="level">1</b></span>
            <button id="sound-btn" aria-label="Звук">🔊</button>
            <button id="pause-btn" aria-label="Пауза">⏸</button>
        </div>
        <div id="buffs"></div>
        <canvas id="game"></canvas>
        <div id="overlay" class="overlay">
            <h1 id="overlay-title">Арканоид</h1>
            <p id="overlay-text">Управляй платформой пальцем</p>
            <button id="start-btn">Играть</button>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
    </script>
</body>
</html>
